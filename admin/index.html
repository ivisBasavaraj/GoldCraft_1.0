<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GoldCraft Admin Panel</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">&#9830;</div>
      <h1>GoldCraft</h1>
      <p>Admin Panel</p>
    </div>
    <div id="loginError" class="alert alert-error hidden"></div>
    <div class="form-group">
      <label>Username</label>
      <input id="loginUser" type="text" placeholder="manager / admin" value="manager"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="loginPass" type="password" placeholder="demo1234" value="demo1234"/>
    </div>
    <button class="btn btn-primary btn-full" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- APP SHELL -->
<div id="appShell" class="app hidden">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon-sm">&#9830;</div>
      <span>GoldCraft</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" onclick="showPage('dashboard',this)">
        <span class="nav-icon">&#9632;</span> Dashboard
      </a>
      <a href="#" class="nav-item" onclick="showPage('karagars',this)">
        <span class="nav-icon">&#128100;</span> Karagars
      </a>
      <a href="#" class="nav-item" onclick="showPage('jobs',this)">
        <span class="nav-icon">&#128295;</span> Jobs
      </a>
      <a href="#" class="nav-item" onclick="showPage('treasury',this)">
        <span class="nav-icon">&#127981;</span> Treasury
      </a>
      <a href="#" class="nav-item" onclick="showPage('advances',this)">
        <span class="nav-icon">&#128176;</span> Advances
      </a>
      <a href="#" class="nav-item" onclick="showPage('payroll',this)">
        <span class="nav-icon">&#128203;</span> Payroll
      </a>
      <a href="#" class="nav-item" onclick="showPage('reports',this)">
        <span class="nav-icon">&#128202;</span> Reports
      </a>
      <a href="#" class="nav-item" onclick="showPage('users',this)">
        <span class="nav-icon">&#128101;</span> Users
      </a>
    </nav>
    <div class="sidebar-footer">
      <span id="sidebarUser"></span>
      <button class="btn btn-sm btn-outline" onclick="doLogout()">Logout</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <div id="page-dashboard" class="page active"></div>
    <div id="page-karagars" class="page"></div>
    <div id="page-jobs" class="page"></div>
    <div id="page-treasury" class="page"></div>
    <div id="page-advances" class="page"></div>
    <div id="page-payroll" class="page"></div>
    <div id="page-reports" class="page"></div>
    <div id="page-users" class="page"></div>
  </main>
</div>

<!-- MODAL -->
<div id="modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<script src="api.js"></script>
<script src="pages/dashboard.js"></script>
<script src="pages/karagars.js"></script>
<script src="pages/jobs.js"></script>
<script src="pages/treasury.js"></script>
<script src="pages/advances.js"></script>
<script src="pages/payroll.js"></script>
<script src="pages/reports.js"></script>
<script src="pages/users.js"></script>
<script src="app.js"></script>
</body>
</html>
